<!doctype html>
<html lang="he" dir="rtl">
<head>
<title>חיפוש עבודה בישראל</title>
{% include "_head.html" %}
</head>
<body>
<div class="wrap">
{% include "_topbar.html" %}
<div class="sub" id="sub"></div>

<form class="panel" id="form" autocomplete="off">
  <input type="hidden" name="mode" value="words">
  <div class="modes" role="tablist">
    <button type="button" data-mode="words" class="on">🔎 חיפוש לפי מילים</button>
    <button type="button" data-mode="cv">📄 לפי קורות חיים</button>
  </div>
  <div class="cvbox" id="cvbox" hidden></div>
  <div class="searchrow">
    <input type="text" name="q" placeholder="מה מחפשים? למשל: python, מנהלת חשבונות, נהג" aria-label="מילות חיפוש">
    <input type="text" name="location" placeholder="איפה? עיר או אזור (ריק = כל הארץ)" list="regions" aria-label="מיקום">
    <button class="primary" type="submit" id="go">חיפוש</button>
  </div>
  <datalist id="regions"></datalist>
  <div class="chips" id="regionChips"></div>

  <details id="advBox">
    <summary>סינון מתקדם</summary>
    <div class="adv">
      <label>היקף משרה
        <select name="job_type">
          <option value="">הכל</option><option value="משרה מלאה">מלאה</option><option value="משרה חלקית">חלקית</option>
          <option value="סטודנט">סטודנטים</option><option value="משמרות">משמרות</option><option value="פרילנס">פרילנס</option>
          <option value="התמחות">התמחות</option>
        </select></label>
      <label>פורסם ב־
        <select name="days"><option value="">כל זמן</option><option value="1">יום אחרון</option><option value="3">3 ימים</option>
          <option value="7">שבוע</option><option value="14">שבועיים</option><option value="30">חודש</option></select></label>
      <label>מקסימום שנות ניסיון
        <select name="max_exp"><option value="">לא משנה</option><option value="0">ללא ניסיון</option><option value="1">עד שנה</option>
          <option value="2">עד 2</option><option value="3">עד 3</option><option value="5">עד 5</option></select></label>
      <label>שכר מינימלי (₪ לחודש)
        <input type="number" name="min_salary" min="0" step="500" placeholder="רק כשהשכר מפורסם"></label>
      <label>מילים לפסילה
        <input type="text" name="exclude" placeholder="senior, ראש צוות"></label>
      <label>חברות לפסילה
        <input type="text" name="exclude_company" placeholder="למשל חברות השמה"></label>
      <label>עמודים בכל אתר
        <select name="pages"><option>1</option><option selected>2</option><option>3</option><option>5</option></select></label>
    </div>
    <div class="checks">
      <label><input type="checkbox" name="remote"> רק מהבית / היברידי</label>
      <label><input type="checkbox" name="match_all"> כל המילים חייבות להופיע</label>
      <label><input type="checkbox" name="title_only"> חיפוש בכותרת בלבד</label>
    </div>
    <div class="checks" id="sourceChecks"></div>
  </details>
  <div class="savedrow">
    <span class="muted">חיפושים שמורים:</span>
    <select id="savedSel" aria-label="חיפושים שמורים"></select>
    <button type="button" class="ghost" id="saveSearch">💾 שמירת החיפוש</button>
  </div>
  <div class="progress" id="progress"></div>
</form>

<div class="toolbar" id="toolbar" hidden>
  <div class="tabs" role="tablist">
    <button data-tab="results" class="on">תוצאות</button>
    <button data-tab="saved">⭐ שמורות</button>
    <button data-tab="applied">✅ הגשתי</button>
  </div>
  <div class="tools">
    <input type="text" id="quick" placeholder="סינון מהיר…" aria-label="סינון מהיר">
    <select id="sort" aria-label="מיון"><option value="match" hidden>ההתאמה הגבוהה ביותר</option><option value="date">החדשות ביותר</option><option value="company">לפי חברה</option><option value="source">לפי אתר</option></select>
  </div>
</div>
<div id="loaderr"></div>
<div class="count" id="count"></div>
<details class="hiddenbox" id="hiddenbox" hidden><summary></summary><ul></ul></details>
<div id="results"></div>
<footer>התוצאות נאספות מאתרי הדרושים ומקושרות למודעה המקורית. משרה שמופיעה בכמה אתרים מוצגת פעם אחת.</footer>
</div>

<script>
const BOOT = {{ boot|safe }};
const $ = s => document.querySelector(s);
const form = $('#form');
const NAMES = Object.fromEntries(BOOT.sources.map(s => [s.name, s.display_name]));
const ACTIVE = BOOT.sources.filter(s => s.active);
let jobs = [], newSet = new Set(), tab = 'results', lastParams = null, hiddenJobs = [];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const total = Object.values(BOOT.stats).reduce((a, b) => a + b, 0);
$('#sub').innerHTML = `חיפוש אחד ב־${ACTIVE.map(s => '<bdi>' + esc(s.display_name) + '</bdi>').join(', ')}` + (total ? ` · ${total.toLocaleString('he-IL')} משרות במאגר` : '');

BOOT.regions.forEach(r => { $('#regions').insertAdjacentHTML('beforeend', `<option value="${esc(r)}">`); });
['מרכז','שרון','צפון','דרום','ירושלים והסביבה','שפלה','remote'].forEach(r => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
  b.textContent = r === 'remote' ? '🏠 מהבית' : r;
  b.onclick = () => {
    const inp = form.location, parts = inp.value.split(',').map(x => x.trim()).filter(Boolean);
    const i = parts.indexOf(r); i >= 0 ? parts.splice(i, 1) : parts.push(r);
    inp.value = parts.join(', '); syncChips();
  };
  b.dataset.val = r; $('#regionChips').append(b);
});
function syncChips() {
  const parts = form.location.value.split(',').map(x => x.trim());
  document.querySelectorAll('#regionChips .chip').forEach(c => c.classList.toggle('on', parts.includes(c.dataset.val)));
}
form.location.addEventListener('input', syncChips);

$('#sourceChecks').innerHTML = '<span style="color:var(--muted)">אתרים:</span>' + BOOT.sources.map(s =>
  `<label title="${s.active ? '' : 'דורש הגדרה ב-config.yaml'}"><input type="checkbox" name="src" value="${s.name}" ${s.active ? 'checked' : 'disabled'}> ${esc(s.display_name)}</label>`).join('');

// ---------------------------------------------------------------- CV mode
let CV = BOOT.cv;
const cvbox = $('#cvbox');
const roleLabel = r => (CV && CV.profile.terms && CV.profile.terms[r]) || r;
function setMode(m) {
  form.mode.value = m;
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  cvbox.hidden = m !== 'cv';
  form.q.hidden = m === 'cv';
  form.q.required = false;
  $('.searchrow').style.gridTemplateColumns = m === 'cv' ? '1fr auto' : '';
  form.title_only.closest('label').hidden = form.match_all.closest('label').hidden = m === 'cv';
  if (m === 'cv') renderCV();
}
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));

function renderCV() {
  if (!CV) {
    cvbox.innerHTML = `<div class="upload">
      <div style="font-size:28px">📄</div>
      <div><b>העלו קורות חיים</b> ונמצא משרות שמתאימות לכם, לפי התאמה בכותרת המשרה ובפירוט שלה</div>
      <label class="primary" style="padding:9px 16px;border-radius:10px;color:#fff">בחירת קובץ<input type="file" id="cvfile" accept=".pdf,.docx,.txt" hidden></label>
      <div style="font-size:12px">PDF, Word (‎.docx‎) או טקסט, עד 5MB · נשמר רק הטקסט, לא הקובץ</div>
      <div id="cvmsg"></div></div>`;
  } else {
    const p = CV.profile;
    p.include = p.include || []; p.exclude = p.exclude || [];
    const cls = {roles: 'role', skills: '', include: 'inc', exclude: 'exc'};
    const tag = (kind, v, label) => `<span class="tag ${cls[kind]}">${esc(label || v)}<button type="button" aria-label="הסרה" data-kind="${kind}" data-v="${esc(v)}">×</button></span>`;
    cvbox.innerHTML = `<div class="cvhead">
        <span>📄 <b>${esc(CV.filename)}</b> <span class="muted">· ${new Date(CV.uploaded_at).toLocaleDateString('he-IL')}${p.years ? ` · כ-${p.years} שנות ניסיון` : ''}</span></span>
        <span class="actions"><label>החלפה<input type="file" id="cvfile" accept=".pdf,.docx,.txt" hidden></label><button type="button" id="cvdel">מחיקה</button></span>
      </div>
      <div class="taglabel">תפקידים שזוהו (חשובים יותר, בעיקר בכותרת המשרה)</div>
      <div class="tags">${p.roles.map(r => tag('roles', r, roleLabel(r))).join('')}<input type="text" placeholder="+ הוספת תפקיד" data-add="roles" title="תפקיד שתוסיפו נלמד ויזוהה גם בקורות חיים של משתמשים אחרים"></div>
      <div class="muted" style="font-size:12px;margin-top:4px">חסר תפקיד? הוסיפו אותו. הוא יילמד ויעזור לזהות אותו גם אצל אחרים.</div>
      <div class="taglabel">כישורים שזוהו</div>
      <div class="tags">${p.skills.map(x => tag('skills', x)).join('')}<input type="text" placeholder="+ הוספת כישור" data-add="skills"></div>
      <div class="filterrows">
        <div><div class="taglabel">➕ לחפש גם</div>
          <div class="tags">${p.include.map(x => tag('include', x)).join('')}<input type="text" placeholder="+ למשל: ניסיון עם כספים" data-add="include" style="width:190px"></div></div>
        <div><div class="taglabel">🚫 לא להציג משרות עם</div>
          <div class="tags">${p.exclude.map(x => tag('exclude', x)).join('')}<input type="text" placeholder="+ למשל: חשבת שכר" data-add="exclude" style="width:170px"></div></div>
      </div>
      <label class="cvopt"><input type="checkbox" id="hideOther" ${p.hide_other_titles !== false ? 'checked' : ''}>
        להסתיר משרות בתפקיד או בתואר שלא מופיעים בקורות החיים (למשל עורך דין, כשבקורות החיים יש רק ידע במשפטים)</label>
      <div class="muted" style="font-size:12px;margin-top:10px">החיפוש באתרים: ${CV.queries.map(esc).join(' · ') || '—'}</div>
      <div id="cvmsg"></div>`;
    cvbox.querySelectorAll('.tag button').forEach(b => b.onclick = () => {
      const k = b.dataset.kind; saveProfile({...p, [k]: p[k].filter(x => x !== b.dataset.v)});
    });
    cvbox.querySelectorAll('input[data-add]').forEach(inp => inp.onkeydown = e => {
      if (e.key !== 'Enter') return; e.preventDefault();
      const v = inp.value.trim(), k = inp.dataset.add; if (!v || p[k].includes(v)) return;
      saveProfile({...p, [k]: [...p[k], v]}).then(() => cvbox.querySelector(`input[data-add=${k}]`)?.focus());
    });
    $('#hideOther').onchange = e => saveProfile({...p, hide_other_titles: e.target.checked});
    $('#cvdel').onclick = async () => { await api('/api/cv', {method: 'DELETE'}); CV = null; renderCV(); };
  }
  $('#cvfile').onchange = e => e.target.files[0] && uploadCV(e.target.files[0]);
}
async function saveProfile(p) {
  try { CV = (await api('/api/cv', {method: 'PUT', body: JSON.stringify({roles: p.roles, skills: p.skills, include: p.include, exclude: p.exclude, hide_other_titles: p.hide_other_titles !== false})})).cv; renderCV(); }
  catch (e) { $('#cvmsg').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
}
async function uploadCV(file) {
  $('#cvmsg').innerHTML = '<div class="muted" style="margin-top:8px">קורא את הקובץ…</div>';
  const fd = new FormData(); fd.append('file', file);
  try {
    const r = await fetch('/api/cv', {method: 'POST', body: fd});
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) { location.href = '/login'; return; }
    if (!r.ok) throw new Error(d.detail || r.status);
    CV = d.cv; renderCV();
  } catch (e) { $('#cvmsg').innerHTML = `<div class="msg err" style="margin-top:8px">${esc(e.message)}</div>`; }
}
['dragover', 'dragenter'].forEach(ev => cvbox.addEventListener(ev, e => { e.preventDefault(); cvbox.classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => cvbox.addEventListener(ev, e => { e.preventDefault(); cvbox.classList.remove('drag'); }));
cvbox.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) uploadCV(f); });

function fill(values) {
  form.reset();
  for (const [k, v] of Object.entries(values || {})) {
    if (k === 'source') continue;
    const el = form.elements[k]; if (!el || el instanceof RadioNodeList) continue;
    el.type === 'checkbox' ? el.checked = !!v : el.value = v ?? '';
  }
  const src = (values || {}).source;
  if (Array.isArray(src) && src.length) form.querySelectorAll('input[name=src]').forEach(c => { if (!c.disabled) c.checked = src.includes(c.value); });
  syncChips();
  setMode((values || {}).mode === 'cv' ? 'cv' : 'words');
}
fill(BOOT.user.settings.defaults);

const api = (url, opts = {}) => fetch(url, {...opts, headers: {'Content-Type': 'application/json', ...(opts.headers || {})}})
  .then(async r => { if (r.status === 401) { location.href = '/login'; throw new Error('login'); }
                     const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.detail || r.status); return d; });

function formValues() {
  const v = {};
  for (const el of form.elements) {
    if (!el.name || el.name === 'src') continue;
    const x = el.type === 'checkbox' ? el.checked : el.value.trim();
    if (x !== '' && x !== false) v[el.name] = x;
  }
  v.source = selectedSources();
  return v;
}

let searches = BOOT.searches;
function renderSaved() {
  $('#savedSel').innerHTML = '<option value="">' + (searches.length ? 'בחרו…' : 'אין עדיין') + '</option>' +
    searches.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
}
renderSaved();
$('#savedSel').onchange = () => { const s = searches.find(x => String(x.id) === $('#savedSel').value); if (s) { fill(s.params); form.requestSubmit(); } };
$('#saveSearch').onclick = async () => {
  const name = prompt('שם לחיפוש (למשל: פייתון במרכז)'); if (!name) return;
  try { const d = await api('/api/searches', {method: 'POST', body: JSON.stringify({name, params: formValues()})});
        searches = d.searches; renderSaved(); $('#savedSel').value = d.id; }
  catch (e) { alert(e.message); }
};

function params() {
  const p = new URLSearchParams();
  for (const el of form.elements) {
    if (!el.name || el.name === 'src') continue;
    const v = el.type === 'checkbox' ? el.checked : el.value.trim();
    if (v === '' || v === false) continue;
    p.set(el.name, v === true ? 'true' : v);
  }
  return p;
}
const selectedSources = () => [...form.querySelectorAll('input[name=src]:checked')].map(x => x.value);

let searchSeq = 0;
form.addEventListener('submit', async ev => {
  ev.preventDefault();
  const p = params();
  const cvMode = form.mode.value === 'cv';
  if (cvMode) {
    if (!CV) { renderCV(); $('#cvmsg').innerHTML = '<div class="msg err" style="margin-top:8px">קודם מעלים קורות חיים</div>'; return; }
    if (!CV.queries.length) { alert('לא זוהו תפקידים או כישורים. הוסיפו לפחות אחד.'); return; }
    p.set('q', CV.queries.join(', '));
  }
  p.delete('mode');
  const srcs = selectedSources();
  if (!srcs.length) { alert('בחרו לפחות אתר אחד'); return; }
  const seq = ++searchSeq;
  $('#go').disabled = true; newSet = new Set(); showError('');
  try {
    // server clock: the results step only looks at jobs this scan found, not the whole database
    const t = await api('/api/search/since');
    const q = new URLSearchParams(p); srcs.forEach(s => q.append('source', s));
    if (cvMode) { q.delete('q'); q.set('cv', 'true'); }
    $('#sort').querySelector('[value=match]').hidden = !cvMode;
    $('#sort').value = cvMode ? 'match' : 'date';
    q.set('since', t.since || ''); q.set('seen_after', t.now);
    lastParams = new URLSearchParams(q);
    jobs = []; hiddenJobs = []; render();
    $('#progress').innerHTML = srcs.map(s => `<span class="pstat" id="p-${s}"><span class="spin"></span><bdi>${esc(NAMES[s])}</bdi></span>`).join('');
    // show results as soon as each site finishes; at most one refresh in flight
    let refreshing = null, again = false;
    const refresh = () => {
      if (refreshing) { again = true; return refreshing; }
      refreshing = (async () => {
        do { again = false; if (seq === searchSeq && tab === 'results') await load(new URLSearchParams(lastParams), 'results'); } while (again);
      })().catch(() => {}).finally(() => { refreshing = null; });
      return refreshing;
    };
    // scan each site in parallel so slow/blocked sites don't hold up the others
    await Promise.all(srcs.map(async s => {
      const lq = new URLSearchParams(p); lq.set('live', 'true'); lq.set('source', s);
      const el = $('#p-' + s);
      try {
        const d = await api('/api/search?' + lq);
        if (d.errors[s]) { el.className = 'pstat err'; el.innerHTML = `<span>⚠ <bdi>${esc(NAMES[s])}</bdi>: שגיאה (העבירו עכבר לפרטים)</span>`; el.title = d.errors[s]; }
        else { el.className = 'pstat ok'; el.innerHTML = `<span>✓ <bdi>${esc(NAMES[s])}</bdi>: ${d.per_source[s] ?? 0} נסרקו, ${d.count} מתאימות</span>`; }
      } catch (e) { el.className = 'pstat err'; el.innerHTML = `<span>⚠ <bdi>${esc(NAMES[s])}</bdi>: לא הגיב</span>`; el.title = String(e); }
      if (seq === searchSeq) refresh();
    }));
    if (seq !== searchSeq) return;
    if (refreshing) await refreshing;
    const fq = new URLSearchParams(lastParams);
    fq.set('mark', 'true');  // remember when this search finished, for next time's "new" badges
    await load(fq, 'results');
  } catch (e) {
    if (seq === searchSeq) showError('לא הצלחנו לטעון את התוצאות. נסו שוב בעוד רגע.' + (jobs.length ? ' (מוצגות התוצאות שנטענו עד עכשיו)' : ''));
  } finally {
    if (seq === searchSeq) { $('#go').disabled = false; saveState(); }
  }
});

function showError(text) {
  $('#loaderr').innerHTML = text ? `<div class="msg err">${esc(text)}</div>` : '';
}

async function load(q, which) {
  tab = which;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === which));
  const d = await api('/api/search?' + q);
  if (tab !== which) return;  // the user switched tabs meanwhile
  jobs = d.jobs; hiddenJobs = which === 'results' ? (d.hidden || []) : []; if (which === 'results') { newSet = new Set(jobs.filter(j => j.is_new).map(j => j.uid)); }
  $('#toolbar').hidden = false; render();
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  const t = b.dataset.tab;
  const done = p => p && p.catch(() => showError('לא הצלחנו לטעון. נסו שוב.'));
  if (t === 'results') { if (lastParams) done(load(new URLSearchParams(lastParams), t)); else { jobs = []; tab = t; render(); } }
  else done(load(new URLSearchParams({status: t}), t));
});
$('#quick').oninput = render; $('#sort').onchange = render;

function render() {
  const f = $('#quick').value.trim().toLowerCase(), sort = $('#sort').value;
  let list = jobs.filter(j => !f || [j.title, j.company, j.location, j.description].join(' ').toLowerCase().includes(f));
  const key = { match: j => -((j.match || {}).score || 0), date: j => -(Date.parse(j.posted_at) || 0), company: j => j.company || 'תתת', source: j => j.source }[sort];
  list = [...list].sort((a, b) => { const x = key(a), y = key(b); return x < y ? -1 : x > y ? 1 : 0; });
  const nNew = list.filter(j => newSet.has(j.uid)).length;
  $('#count').textContent = list.length ? `${list.length} משרות` + (nNew && tab === 'results' ? ` · ${nNew} חדשות מאז החיפוש הקודם שלך` : '') : '';
  const hb = $('#hiddenbox');
  hb.hidden = !hiddenJobs.length || tab !== 'results';
  if (hiddenJobs.length) {
    const nEx = hiddenJobs.filter(h => h.why === 'exclude').length, nTi = hiddenJobs.length - nEx;
    hb.querySelector('summary').textContent = `הוסתרו ${hiddenJobs.length} משרות` +
      [nEx ? `${nEx} לפי "לא להציג"` : '', nTi ? `${nTi} בתפקיד שלא מופיע בקורות החיים` : ''].filter(Boolean).map(x => ` · ${x}`).join('');
    hb.querySelector('ul').innerHTML = hiddenJobs.map(h => `<li><a href="${esc(h.url)}" target="_blank" rel="noopener" data-job>${esc(h.title)}</a>
      ${h.company ? `· ${esc(h.company)}` : ''} <span class="why">(${h.why === 'exclude' ? 'מכיל' : 'דורש'}: ${esc(h.term)})</span></li>`).join('');
  }
  if (!list.length) { $('#results').innerHTML = `<div class="empty">${tab === 'results' ? 'לא נמצאו משרות. נסו מילים אחרות או הרחיבו את האזור.' : 'אין עדיין משרות ברשימה הזו.'}</div>`; return; }
  $('#results').innerHTML = list.map(card).join('');
  saveState();
}

function card(j) {
  const date = j.posted_at ? new Date(j.posted_at).toLocaleDateString('he-IL') : '';
  const st = j.extra?.status;
  const also = (j.extra?.also_on || []).map(o => `<a class="badge" href="${esc(o.url)}" target="_blank" rel="noopener" data-job>גם ב־${esc(NAMES[o.source] || o.source)}</a>`).join('');
  const m = j.match;
  const matchBadge = m ? `<span class="match ${m.score < 60 ? 'mid' : ''}">התאמה ${m.score}%</span>` : '';
  const matchedLine = m && m.matched.length ? `<div class="matched">תואם לקורות החיים: ${m.matched.map(x => esc(roleLabel(x))).join(', ')}</div>` : '';
  return `<article class="job" id="j-${j.uid}">
    <h3>${matchBadge} <a href="${esc(j.url)}" target="_blank" rel="noopener" data-job>${esc(j.title)}</a>
      ${newSet.has(j.uid) ? '<span class="badge new">חדש</span>' : ''}</h3>
    <div class="meta">
      ${j.company ? `<span>🏢 ${esc(j.company)}</span>` : ''}
      ${j.location ? `<span>📍 ${esc(j.location)}</span>` : ''}
      ${j.job_type ? `<span>⏱ ${esc(j.job_type)}</span>` : ''}
      ${j.salary ? `<span>₪ ${esc(j.salary)}</span>` : ''}
      ${date ? `<span>📅 ${date}</span>` : ''}
      <bdi class="badge src">${esc(NAMES[j.source] || j.source)}</bdi>${also}
    </div>
    ${matchedLine}
    ${j.description ? `<div class="desc" onclick="this.classList.toggle('open')" title="לחצו להרחבה">${esc(j.description)}</div>` : ''}
    <div class="jobfoot">
      <button class="${st === 'saved' ? 'on' : ''}" onclick="mark('${j.uid}','saved',this)">⭐ ${st === 'saved' ? 'שמורה' : 'שמירה'}</button>
      <button class="${st === 'applied' ? 'on' : ''}" onclick="mark('${j.uid}','applied',this)">✅ ${st === 'applied' ? 'הגשתי' : 'סימון שהגשתי'}</button>
      <button onclick="mark('${j.uid}','hidden',this)">🙈 הסתרה</button>
    </div></article>`;
}

async function mark(uid, status, btn) {
  try { await api(`/api/jobs/${uid}/status/${status}`, {method: 'POST'}); } catch (e) { btn.textContent = 'שגיאה'; return; }
  const j = jobs.find(x => x.uid === uid); if (j) { j.extra = {...(j.extra || {}), status}; }
  if (status === 'hidden') { jobs = jobs.filter(x => x.uid !== uid); }
  render();
}

// ---------------------------------------------------------------- keep results when coming back to the page
const STATE_KEY = 'jsil-results';
function saveState() {
  try {
    sessionStorage.setItem(STATE_KEY, JSON.stringify({
      jobs: jobs.map(j => ({...j, description: (j.description || '').slice(0, 1500)})),
      hiddenJobs, newSet: [...newSet], tab, lastParams: lastParams ? lastParams.toString() : null,
      progress: $('#progress').innerHTML, form: formValues(), sort: $('#sort').value,
      matchSort: !$('#sort').querySelector('[value=match]').hidden, quick: $('#quick').value, scrollY: window.scrollY,
    }));
  } catch (e) {}
}
function restoreState() {
  let st = null;
  try { st = JSON.parse(sessionStorage.getItem(STATE_KEY) || 'null'); } catch (e) {}
  if (!st || !st.lastParams) return;
  fill(st.form);
  jobs = st.jobs || []; hiddenJobs = st.hiddenJobs || []; newSet = new Set(st.newSet || []);
  tab = st.tab || 'results'; lastParams = new URLSearchParams(st.lastParams);
  $('#progress').innerHTML = st.progress || '';
  $('#sort').querySelector('[value=match]').hidden = !st.matchSort;
  $('#sort').value = st.sort || 'date'; $('#quick').value = st.quick || '';
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#toolbar').hidden = false; render();
  requestAnimationFrame(() => window.scrollTo(0, st.scrollY || 0));
}
restoreState();
let scrollTimer = null;
window.addEventListener('scroll', () => { clearTimeout(scrollTimer); scrollTimer = setTimeout(saveState, 300); }, {passive: true});
window.addEventListener('pagehide', saveState);

// job links always open in a new tab, even in browsers/in-app views that ignore target=_blank
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-job]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  saveState();
  const w = window.open(a.href, '_blank');
  if (w) { try { w.opener = null; } catch (_) {} } else { location.href = a.href; }  // popup blocked: results are saved
});
</script>
